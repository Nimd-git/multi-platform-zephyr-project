#
# 平台冒烟应用通用配置（qemu_cortex_m3 / qemu_riscv64 共用）
# 板卡差异放在 boards/<board>.conf 与 boards/<board>.overlay
#

# ---- 内核服务层：线程/调度/事件 ------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
# FSM 延迟工作项运行在系统工作队列（64 位 RISC-V 下预留充足栈）
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_EVENTS=y

# ---- 硬件抽象层：GPIO/UART/SPI/I2C ----------------------------------------
CONFIG_GPIO=y
CONFIG_SERIAL=y
# CONFIG_SPI 与 CONFIG_I2C 由板级 conf 按需启用（依赖具体外设节点）

# ---- 系统服务层：日志（多后端/级别控制）+ 串口 Shell ----------------------
CONFIG_LOG=y
# v4.4：日志级别为整数（0..4），3=INFO
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_DEBUG_THREAD_INFO=y

# ---- 存储中间件：settings KV，QEMU 下使用 RAM 后端 ------------------------
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y

# ---- 平台框架（树外模块 platform/） ----------------------------------------
CONFIG_PLATFORM_SERVICES=y
CONFIG_PLAT_DEVICE_MGMT=y
CONFIG_PLAT_PM=y
CONFIG_PLAT_MW_STORAGE=y
CONFIG_PLAT_MW_DATA=y
# CONFIG_PLAT_MONITOR 在设备树存在 plat,platform-monitor 节点时默认 y
# 通信（Modbus）与 UWB（SR040）由板级 conf 按需启用（依赖具体外设节点）

# ---- 虚拟文件系统（LittleFS） ----------------------------------------------
# 需板级 overlay 提供 fstab 节点；QEMU 下无 flash 分区，故不默认启用
# CONFIG_FILE_SYSTEM=y
# CONFIG_FILE_SYSTEM_LITTLEFS=y
# CONFIG_FILE_SYSTEM_LIB_LINK=y
# CONFIG_PLAT_FS=y

# ---- 网络协议栈（IPv4 + MQTT） ----------------------------------------------
# 需板级 conf 启用 WiFi 及相应网络配置；无网络接口的平台不启用
# CONFIG_NETWORKING=y
# CONFIG_NET_IPV4=y
# CONFIG_WIFI=y
# CONFIG_MQTT_LIB=y
# CONFIG_PLAT_NET=y
