#
# esp32c3_devkitc 调试配置（应用侧副本，替代对 Zephyr 源码树的修改）
#
# 上游 zephyr/boards/espressif/esp32c3_devkitc/support/openocd.cfg 默认使用
# 外接 ESP-Prog（ftdi/esp32_devkitj_v1.cfg）；DevKitC-02 无板载调试器，
# 本文件改为内置 USB-JTAG（GPIO18/19）。
#
# 使用方式：Workbench 调试配置中将 OpenOCD 配置文件指向本文件
# （runner 会把本文件所在目录加入 openocd -s 搜索路径，并替代默认的
#  <board>/support/openocd.cfg）。

set ESP_RTOS Zephyr

# ESP32C3 has built-in JTAG interface over USB port in pins GPIO18/GPIO19 (D-/D+).
source [find interface/esp_usb_jtag.cfg]

# Otherwise, use external JTAG programmer as ESP-Prog
# source [find interface/ftdi/esp32_devkitj_v1.cfg]

source [find target/esp32c3.cfg]
# 内置 USB-JTAG 烧写 flash 时 5MHz 偶发 "Error finishing flash operation"，
# 降速到 1MHz 保证稳定（与乐鑫官方 builtin-jtag 示例一致）。
adapter speed 1000
