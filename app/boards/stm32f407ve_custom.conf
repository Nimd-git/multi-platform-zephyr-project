# stm32f407ve_custom（STM32F407VET6）板级差异配置

# ---- 外设驱动 --------------------------------------------------------------
CONFIG_SPI=y
CONFIG_I2C=y

# ---- 虚拟文件系统（LittleFS） ----------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_LIB_LINK=y

# ---- 平台服务 --------------------------------------------------------------
CONFIG_PLAT_FS=y
# CONFIG_PLAT_NET is not set（无网络接口，预留）

# ---- 中间件：Modbus RTU 主站（USART2 PA2/PA3，见 overlay modbus0） ----------
CONFIG_PLAT_MW_COMMUNICATION=y

# ---- 存储：settings 文件后端（落 LittleFS /lfs） ---------------------------
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_NONE=n
