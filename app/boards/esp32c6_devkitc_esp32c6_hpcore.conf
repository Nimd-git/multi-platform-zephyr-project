# esp32c6_devkitc/esp32c6/hpcore（乐鑫 ESP32-C6-DevKitC-1）板级差异配置
#
# 该板卡 defconfig 已默认启用：
#   CONFIG_CONSOLE=y, CONFIG_SERIAL=y, CONFIG_UART_CONSOLE=y, CONFIG_GPIO=y
# 因此此处无需重复声明。
#
# 若通过 west flash 烧录且不使用 MCUboot，构建时可关闭 sysbuild：
#   west build -b esp32c6_devkitc/esp32c6/hpcore app -- -DCONFIG_BOOTLOADER_MCUBOOT=n
# 或添加 west 参数：--sysbuild=no
#
# 若使用 Workbench 构建，在 settings.json 的 build-args 中按需传入。

# ---- 网络协议栈：WiFi + IPv4 + MQTT ---------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_BUILD_ONLY_NO_BLOBS=y

# ---- MQTT 客户端库 ---------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60

# ---- 虚拟文件系统（LittleFS） ----------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_LIB_LINK=y

# ---- 平台服务 --------------------------------------------------------------
CONFIG_PLAT_FS=y
CONFIG_PLAT_NET=y

# ---- 外设驱动 --------------------------------------------------------------
CONFIG_SPI=y
CONFIG_I2C=y

# ---- 中间件：Modbus RTU 主站（UART1 GPIO4/5，见 overlay modbus0） -----------
CONFIG_PLAT_MW_COMMUNICATION=y

# ---- 存储：settings 文件后端（落 LittleFS /lfs） ---------------------------
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_NONE=n
