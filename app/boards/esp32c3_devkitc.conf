# esp32c3_devkitc（乐鑫 ESP32-C3-DevKitC-02）板级差异配置
#
# 该板卡 defconfig 已默认启用：
#   CONFIG_CONSOLE=y, CONFIG_SERIAL=y, CONFIG_UART_CONSOLE=y, CONFIG_GPIO=y
# 因此此处无需重复声明。
#
# 与 esp32c6 相同，构建依赖 Python venv 中的 esptool>=5.0.2：
#   pip install "esptool>=5.0.2"
#
# 若通过 west flash 烧录且不使用 MCUboot，构建时可关闭 sysbuild：
#   west build -b esp32c3_devkitc app -- -DCONFIG_BOOTLOADER_MCUBOOT=n

# ---- 控制台与 shell 分离（配合 overlay 中的 chosen）----
# LOG 走独立 UART 日志后端（设备取自 zephyr,console = usb_serial，即 COM16），
# 不再借用 shell 后端，避免每条日志触发 shell 提示符重绘。
CONFIG_LOG_BACKEND_UART=y
# shell 已移至物理 UART0；关闭 shell 内嵌日志后端，防止日志同时出现在 shell 口。
CONFIG_SHELL_LOG_BACKEND=n

