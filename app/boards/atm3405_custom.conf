# atm3405_custom（ATM3405-WQK）板级差异配置

# ---- 外设驱动 --------------------------------------------------------------
# SPI/I2C 由 SoC 提供，但板级默认不启用（无外部设备连接）
# CONFIG_SPI=y
# CONFIG_I2C=y

# ---- 虚拟文件系统 ----------------------------------------------------------
# RRAM 上的 LittleFS 需要 Atmosic 官方驱动适配，当前跳过
# CONFIG_FILE_SYSTEM is not set

# ---- 网络协议栈 ------------------------------------------------------------
# 无网络接口，预留
# CONFIG_PLAT_NET is not set

# ---- 电源管理（暂时关闭：sys_clock_correct 在 v4.4 不存在） ------------------
# CONFIG_PM=y
# CONFIG_PM_DEVICE_RUNTIME=y
