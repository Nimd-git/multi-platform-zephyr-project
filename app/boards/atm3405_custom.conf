# atm3405_custom（ATM3405-WQK）板级差异配置

# ---- 外设驱动 --------------------------------------------------------------
# SPI 启用：UWB SR040 挂 SPI0（见 overlay nxp_uwb_device）；I2C 仍不启用
CONFIG_SPI=y
# CONFIG_I2C=y

# ---- 中间件：UWB（NXP SR040 @ SPI0） -----------------------------------------
CONFIG_NXP_UWB_ZEPHYR_MODULE=y
CONFIG_NXP_UWB_DEVICE_SR040=y
CONFIG_PLAT_MW_UWB=y
# SDK zephyr_generic 层用 spi_transceive_cb（异步 SPI），需启用
CONFIG_SPI_ASYNC=y

# ---- 虚拟文件系统 ----------------------------------------------------------
# RRAM 上的 LittleFS 需要 Atmosic 官方驱动适配，当前跳过
# CONFIG_FILE_SYSTEM is not set

# ---- 网络协议栈 ------------------------------------------------------------
# 无网络接口，预留
# CONFIG_PLAT_NET is not set

# ---- 电源管理（暂时关闭：sys_clock_correct 在 v4.4 不存在） ------------------
# CONFIG_PM=y
# CONFIG_PM_DEVICE_RUNTIME=y
